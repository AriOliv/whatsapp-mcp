# Local, private WhatsApp MCP (Go/whatsmeow) + its own Postgres.
#
#   docker compose -f compose.local.yml --env-file .env.local up -d --build
#
# Nothing here is reachable from the internet or the LAN: the MCP port is
# published on 127.0.0.1 only, and Postgres is not published at all (it lives on
# the internal compose network). This stack has its OWN database: never point
# it at the production Cloud SQL — two processes driving the same companion
# device fight over the session and knock production offline.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: whatsapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  whatsapp-mcp:
    # Binary built on the host (the Docker VM's outbound TLS is flaky here):
    #   GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
    #     -o .local-build/whatsapp-mcp ./cmd/whatsapp-mcp
    # With a working network, `dockerfile: Dockerfile.mcp` + `context: .` also works.
    build:
      context: .local-build
    image: whatsapp-mcp:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_PORT:-3000}:3000"
    environment:
      MCP_MODE: http
      PORT: "3000"
      PUBLIC_URL: http://localhost:${MCP_PORT:-3000}
      MCP_JWT_SECRET: ${MCP_JWT_SECRET:?set MCP_JWT_SECRET in .env.local}
      DATABASE_URL: postgres://whatsapp:${POSTGRES_PASSWORD}@db:5432/whatsapp?sslmode=disable
      WA_DEVICE_NAME: ${WA_DEVICE_NAME:-Avenia WhatsApp MCP (local)}
      WA_HISTORY_SYNC: ${WA_HISTORY_SYNC:-on}
      # Optional gateway REST /api/* (static bearer, only the listed accounts).
      # Empty values keep it off.
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:-}
      INBOUND_WEBHOOK_ACCOUNTS: ${INBOUND_WEBHOOK_ACCOUNTS:-}

volumes:
  pgdata:

networks:
  default:
    # Explicit subnet: Docker's predefined pools are exhausted on this machine.
    ipam:
      config:
        - subnet: 10.213.77.0/24
